services:
  app:
    build: .
    ports:
      - "8090:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
      - mailpit

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: gestion_des_chants
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

  dbgate:
    image: dbgate/dbgate:latest
    ports:
      - "3000:3000"
    environment:
      CONNECTIONS: db1
      LABEL_db1: MySQL local
      SERVER_db1: db
      USER_db1: root
      PASSWORD_db1: root
      PORT_db1: 3306
      ENGINE_db1: mysql@dbgate-plugin-mysql
    depends_on:
      - db

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  dbdata:
